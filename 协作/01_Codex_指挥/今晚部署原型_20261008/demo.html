<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>晶圆缺陷判读演示</title><style>
body{font-family:system-ui,sans-serif;color:#172331;background:#f2f5f8;margin:0}main{max-width:1050px;margin:40px auto;padding:0 22px}h1{font-size:30px}p{color:#536476;line-height:1.7}.card{background:white;border-radius:14px;padding:24px;border:1px solid #dce4ec}.grid{display:grid;grid-template-columns:350px 1fr;gap:24px}img{width:100%;image-rendering:pixelated;background:#111;border-radius:8px}button{background:#2458da;color:white;border:0;border-radius:8px;padding:12px 22px;font-size:16px;margin-top:18px;cursor:pointer}button:disabled{background:#8795ad;cursor:wait}dl{display:grid;grid-template-columns:90px 1fr;gap:14px;line-height:1.5}dt{color:#657587}dd{margin:0}.notice{padding:12px;background:#eef3ff;border-radius:8px;line-height:1.6}pre{white-space:pre-wrap;word-break:break-all;font-size:12px}.status{margin:15px 0;font-weight:600}@media(max-width:800px){.grid{grid-template-columns:1fr}} </style>
<main><h1>晶圆缺陷判读</h1><p>上传标准448×448晶圆BIN图，查看模型生成的类别、形态、位置与方位。</p>
<div class="card grid"><section><input id="file" type="file" accept="image/png"><p>黑色为晶圆外，绿色为合格die，红色为失效die。</p><img id="preview" alt="待上传晶圆图"><button id="run" disabled>开始判读</button><div id="status" class="status">等待选择图片</div></section>
<section><div id="notice" class="notice">模型输出用于辅助判读。存在不确定内容时会提示复核。</div><dl id="fields"></dl><details><summary>查看返回记录</summary><pre id="raw"></pre></details></section></div></main>
<script>
const file=document.getElementById('file'),run=document.getElementById('run'),status=document.getElementById('status'),fields=document.getElementById('fields');let selected=null,previewURL=null;
file.onchange=()=>{selected=file.files[0]||null;run.disabled=!selected;status.textContent=selected?'图片已选择':'等待选择图片';if(previewURL)URL.revokeObjectURL(previewURL);if(selected){previewURL=URL.createObjectURL(selected);document.getElementById('preview').src=previewURL}};
run.onclick=async()=>{if(!selected)return;run.disabled=true;status.textContent='正在判读';fields.replaceChildren();try{const t0=performance.now();const response=await fetch('/predict',{method:'POST',headers:{'Content-Type':'image/png'},body:selected});const d=await response.json();if(!response.ok)throw Error(d.error||'请求失败');const elapsed=(performance.now()-t0)/1000;status.textContent=`判读完成 · ${elapsed.toFixed(2)}秒`;document.getElementById('raw').textContent=JSON.stringify(d,null,2);document.getElementById('notice').textContent=d.needs_review?'建议复核：'+(d.review_reasons.join('；')||'输出未满足结构约定'):'已生成判读结果；内容以实际图像为准';const r=d.result||{};const names=[['defect_class','类别'],['morphology','主要形态'],['radial_zone','位置'],['clock_direction','方位'],['caption_zh','描述'],['uncertainty','不确定项']];for(const [key,label] of names){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=r[key]===null?'不适用或未确定':(r[key]||'未提供');fields.append(dt,dd)}}catch(e){status.textContent='判读未完成';document.getElementById('notice').textContent=e.message}finally{run.disabled=!selected}};
</script></html>
